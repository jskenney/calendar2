name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    # PHP 8.3 is the supported version; 8.4 is an early warning only.
    continue-on-error: ${{ matrix.php == '8.4' }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # calendar: v4 needs it (the login tests switch a course from v4 to Cal5)
          extensions: calendar, dom, mbstring
          coverage: none
      - name: Fetch calendar-core (v4) at the pinned commit
        run: tests/compat/fetch-v4.sh
      - name: Lint
        run: |
          find . -path ./.v4 -prune -o \( -name '*.php' -o -path ./bin/cal5 \) -type f -print0 \
            | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: php tests/run.php

  compatibility:
    name: Compatibility with v4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: calendar, dom, mbstring
          coverage: none
      - name: Fetch calendar-core (v4) at the pinned commit
        run: tests/compat/fetch-v4.sh
      - name: v4 still matches the recorded results
        run: |
          php tests/compat/compat.php check --impl=v4 --v4=.v4
          php tests/compat/compat.php check-structure --impl=v4 --v4=.v4
      - name: Cal5 builds the same course structure as v4 (events, dates, boxes, keys)
        run: php tests/compat/compat.php check-structure --impl=cal5
      - name: Cal5 matches v4 for every request of every fixture
        run: php tests/compat/compat.php check --impl=cal5

  browser:
    name: Browser check (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring
          coverage: none
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Pages load without errors, Bootstrap, jQuery or other hosts
        run: node tests/browser/check.js --screenshots=screenshots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
